<div class="course-form-container">
  <div class="form-card">
    <h1>{{ isEditMode ? '✏️ Modifier le cours' : '➕ Nouveau cours' }}</h1>

    <div *ngIf="error" class="error">
      <span>⚠️</span>
      {{ error }}
    </div>

    <form [formGroup]="courseForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="title">
          Titre du cours
          <span class="required">*</span>
        </label>
        <input 
          type="text" 
          id="title" 
          formControlName="title"
          class="form-control"
          placeholder="Ex: Introduction à Angular"
          [class.invalid]="courseForm.get('title')?.invalid && courseForm.get('title')?.touched">
        <div class="error-message" *ngIf="courseForm.get('title')?.invalid && courseForm.get('title')?.touched">
          Le titre est requis (minimum 3 caractères)
        </div>
      </div>

      <div class="form-group">
        <label for="description">
          Description
          <span class="required">*</span>
        </label>
        <textarea 
          id="description" 
          formControlName="description"
          class="form-control"
          rows="5"
          placeholder="Décrivez le contenu et les objectifs du cours..."
          [class.invalid]="courseForm.get('description')?.invalid && courseForm.get('description')?.touched">
        </textarea>
        <div class="error-message" *ngIf="courseForm.get('description')?.invalid && courseForm.get('description')?.touched">
          La description est requise (minimum 10 caractères)
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="trainerId">
            ID Formateur
            <span class="required">*</span>
          </label>
          <input 
            type="number" 
            id="trainerId" 
            formControlName="trainerId"
            class="form-control"
            placeholder="Ex: 1"
            min="1"
            [class.invalid]="courseForm.get('trainerId')?.invalid && courseForm.get('trainerId')?.touched">
          <div class="error-message" *ngIf="courseForm.get('trainerId')?.invalid && courseForm.get('trainerId')?.touched">
            L'ID du formateur est requis
          </div>
        </div>

        <div class="form-group">
          <label for="duration">
            Durée (heures)
            <span class="required">*</span>
          </label>
          <input 
            type="number" 
            id="duration" 
            formControlName="duration"
            class="form-control"
            placeholder="Ex: 40"
            min="1"
            [class.invalid]="courseForm.get('duration')?.invalid && courseForm.get('duration')?.touched">
          <div class="error-message" *ngIf="courseForm.get('duration')?.invalid && courseForm.get('duration')?.touched">
            La durée est requise
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="level">
          Niveau
          <span class="required">*</span>
        </label>
        <select 
          id="level" 
          formControlName="level"
          class="form-control">
          <option *ngFor="let level of levels" [value]="level">
            {{ level }}
          </option>
        </select>
        <p class="form-hint">Sélectionnez le niveau de difficulté du cours</p>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="cancel()">
          Annuler
        </button>
        <button type="submit" class="btn-submit" [disabled]="courseForm.invalid || loading">
          {{ loading ? '⏳ Enregistrement...' : (isEditMode ? '💾 Mettre à jour' : '✨ Créer le cours') }}
        </button>
      </div>
    </form>
  </div>
</div>
