<div class="container">
  <div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-md-5">
      <div class="card shadow-lg">
        <div class="card-body p-5">
          <div class="text-center mb-4">
            <h2 class="fw-bold">Connexion</h2>
            <p class="text-muted">Plateforme E-Learning Smartek</p>
          </div>

          <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
            <div class="mb-3">
              <label for="username" class="form-label">Nom d'utilisateur</label>
              <input
                type="text"
                class="form-control form-control-lg"
                id="username"
                name="username"
                [(ngModel)]="username"
                required
                #usernameField="ngModel"
                placeholder="admin, formateur, ou apprenant"
              />
              <div *ngIf="usernameField.invalid && usernameField.touched" class="text-danger mt-1">
                Le nom d'utilisateur est requis
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">Mot de passe</label>
              <input
                type="password"
                class="form-control form-control-lg"
                id="password"
                name="password"
                [(ngModel)]="password"
                required
                #passwordField="ngModel"
              />
              <div *ngIf="passwordField.invalid && passwordField.touched" class="text-danger mt-1">
                Le mot de passe est requis
              </div>
            </div>

            <div *ngIf="error" class="alert alert-danger">
              <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
            </div>

            <button
              type="submit"
              class="btn btn-primary btn-lg w-100"
              [disabled]="!loginForm.form.valid || loading"
            >
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
              {{ loading ? 'Connexion...' : 'Se connecter' }}
            </button>
          </form>

          <div class="mt-4 p-3 bg-light rounded">
            <p class="mb-2 fw-bold">Comptes de test:</p>
            <small class="d-block">Admin: admin / admin123</small>
            <small class="d-block">Formateur: formateur / formateur123</small>
            <small class="d-block">Apprenant: apprenant / apprenant123</small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
