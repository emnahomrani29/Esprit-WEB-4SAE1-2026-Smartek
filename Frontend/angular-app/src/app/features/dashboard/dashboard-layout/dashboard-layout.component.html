<!-- Admin/Trainer Layout (with sidebar) -->
<div *ngIf="!isLearner" class="min-h-screen bg-gray-50">
  <app-sidebar></app-sidebar>
  
  <main class="ease-soft-in-out xl:ml-68.5 relative h-full max-h-screen rounded-xl transition-all duration-200">
    <div class="w-full px-6 py-6 mx-auto">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

<!-- Learner Layout (simple, no sidebar) -->
<div *ngIf="isLearner" class="min-h-screen bg-gray-50">
  <!-- Simple Top Bar -->
  <div class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <!-- Logo/Title -->
        <div class="flex items-center">
          <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-600 to-blue-800 bg-clip-text text-transparent">
            SMARTEK
          </h1>
        </div>

        <!-- Nav Links -->
        <nav class="hidden md:flex items-center space-x-1">
          <a routerLink="/dashboard/events" routerLinkActive="bg-blue-50 text-blue-600"
            class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            Événements
          </a>
          <a routerLink="/dashboard/my-courses" routerLinkActive="bg-blue-50 text-blue-600"
            class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
            </svg>
            Mes Cours
          </a>
          <a routerLink="/dashboard/my-training" routerLinkActive="bg-blue-50 text-blue-600"
            class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
            </svg>
            Formations
          </a>
          <a routerLink="/dashboard/my-exams" routerLinkActive="bg-blue-50 text-blue-600"
            class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            Examens
          </a>
        </nav>

        <!-- User Menu -->
        <div class="flex items-center space-x-4">
          <span class="text-sm text-gray-600">
            Bonjour, {{ userInfo?.firstName }}
          </span>
          
          <!-- Profile Button -->
          <a 
            routerLink="/dashboard/profile"
            class="inline-flex items-center px-3 py-2 text-sm font-medium text-gray-700 hover:text-blue-600 transition-colors">
            <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
            Profile
          </a>

          <!-- Logout Button -->
          <button 
            (click)="logout()"
            class="inline-flex items-center px-4 py-2 bg-red-600 text-white text-sm font-medium rounded-lg hover:bg-red-700 transition-colors">
            <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
            Déconnexion
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto py-6">
    <router-outlet></router-outlet>
  </main>

  <!-- Simple Footer -->
  <footer class="bg-white border-t border-gray-200 mt-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
      <div class="flex justify-between items-center">
        <p class="text-sm text-gray-500">
          © 2024 SMARTEK. Tous droits réservés.
        </p>
        <div class="flex items-center space-x-4">
          <a routerLink="/dashboard/profile" class="text-sm text-gray-500 hover:text-blue-600">
            Mon Profil
          </a>
          <button (click)="logout()" class="text-sm text-gray-500 hover:text-red-600">
            Se déconnecter
          </button>
        </div>
      </div>
    </div>
  </footer>
</div>
