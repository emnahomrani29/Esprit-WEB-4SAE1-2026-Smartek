<div class="p-6">
  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Gestion des Utilisateurs</h1>
    <span class="text-sm text-gray-500">{{ filtered.length }} utilisateur(s)</span>
  </div>

  <!-- Filtres -->
  <div class="flex flex-wrap gap-3 mb-6">
    <input [(ngModel)]="search" (ngModelChange)="applyFilter()" type="text"
      placeholder="Rechercher par nom ou email..."
      class="border rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 w-64">

    <div class="flex gap-2">
      <button *ngFor="let r of roles"
        (click)="filterRole = r; applyFilter()"
        class="px-3 py-2 rounded-full text-xs font-medium transition border"
        [class.bg-blue-600]="filterRole === r"
        [class.text-white]="filterRole === r"
        [class.border-blue-600]="filterRole === r"
        [class.bg-white]="filterRole !== r"
        [class.text-gray-600]="filterRole !== r"
        [class.border-gray-200]="filterRole !== r">
        {{ r === 'ALL' ? 'Tous' : r }}
      </button>
    </div>
  </div>

  <div *ngIf="loading" class="text-center py-10 text-gray-400">Chargement...</div>

  <div *ngIf="!loading && filtered.length === 0"
    class="text-center py-16 bg-white rounded-xl shadow text-gray-400">
    <p class="text-5xl mb-3">👥</p>
    Aucun utilisateur trouvé
  </div>

  <!-- Table -->
  <div *ngIf="!loading && filtered.length > 0" class="bg-white rounded-xl shadow overflow-hidden">
    <table class="w-full text-sm text-left">
      <thead class="bg-gray-50 text-gray-600 uppercase text-xs">
        <tr>
          <th class="px-4 py-3">Utilisateur</th>
          <th class="px-4 py-3">Email</th>
          <th class="px-4 py-3">Rôle</th>
          <th class="px-4 py-3">Expérience</th>
          <th class="px-4 py-3">Inscrit le</th>
          <th class="px-4 py-3">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of filtered" class="border-t hover:bg-gray-50">
          <td class="px-4 py-3">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-sm">
                {{ getInitial(u.firstName) }}
              </div>
              <span class="font-medium text-gray-800">{{ u.firstName }}</span>
            </div>
          </td>
          <td class="px-4 py-3 text-gray-500">{{ u.email }}</td>
          <td class="px-4 py-3">
            <span class="px-2 py-1 rounded-full text-xs font-medium" [ngClass]="getRoleClass(u.role)">
              {{ u.role }}
            </span>
          </td>
          <td class="px-4 py-3 text-gray-500">{{ u.experience ?? 0 }} ans</td>
          <td class="px-4 py-3 text-gray-400 text-xs">
            {{ u.createdAt | date:'dd/MM/yyyy' }}
          </td>
          <td class="px-4 py-3">
            <button (click)="deleteUser(u.userId)"
              class="text-red-400 hover:text-red-600 text-xs px-2 py-1 border border-red-200 rounded-lg">
              Supprimer
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
